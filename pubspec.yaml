name: calorie_tracker
description: A simple calorie tracking app (Version 0 / MVP).
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.6

  # State management
  flutter_bloc: ^8.1.3
  # Routing
  go_router: ^13.2.2
  # Dependency injection (manual registration, no code-gen)
  get_it: ^7.6.4
  # Functional error handling: Either<Failure, T>
  fpdart: ^1.1.0
  # Value equality for entities/states
  equatable: ^2.0.5

  # Local SQLite database
  sqflite: ^2.3.0
  path: ^1.8.3

  # Resolving the persistent app documents directory
  path_provider: ^2.1.1

  # Single-value settings (daily calorie target)
  shared_preferences: ^2.2.2

  # Date formatting
  intl: ^0.19.0

  # Generating custom_<uuid> ids for user-added foods
  uuid: ^4.2.2

  # Reserved for the future Azure datasource — not actively used yet
  http: ^1.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  # Cubit testing
  bloc_test: ^9.1.4
  # Mocking repositories/data sources in tests, no code-gen
  mocktail: ^1.0.1
  # Runs sqflite against a real database in tests, without an emulator
  sqflite_common_ffi: ^2.3.0

flutter:
  uses-material-design: true